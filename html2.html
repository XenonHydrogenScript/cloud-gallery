<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加载中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #c1e4ff, #e0f2ff);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.6s ease;
        }

        .load-box {
            width: 180px;
            height: 180px;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(31, 135, 255, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        /* 加载完成：缩成圆形+渐隐 */
        .load-box.end-close {
            transform: scale(0);
            opacity: 0;
            border-radius: 50%;
        }

        .percent-text {
            margin-top: 30px;
            font-size: 22px;
            color: #1989fa;
            font-weight: 600;
            transition: all 0.6s ease;
        }
        .percent-text.end-close {
            opacity: 0;
            transform: translateY(-20px);
        }

        .flow-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 300%;
            height: 300%;
            background: linear-gradient(
                45deg,
                rgba(100, 180, 255, 0.08),
                rgba(150, 210, 255, 0.12),
                rgba(80, 160, 255, 0.08),
                rgba(120, 190, 255, 0.12)
            );
            animation: flowMove 8s linear infinite;
            z-index: 1;
        }

        @keyframes flowMove {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .progress-wrap {
            width: 120px;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            z-index: 2;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #409eff, #69b1ff);
            border-radius: 6px;
            transition: width 0.15s ease;
        }
    </style>
</head>
<body>
    <div class="load-box" id="loadBox">
        <div class="flow-bg"></div>
        <div class="progress-wrap">
            <div class="progress-bar" id="bar"></div>
        </div>
    </div>
    <div class="percent-text" id="percent">0%</div>

    <script>
        const bar = document.getElementById('bar');
        const percent = document.getElementById('percent');
        const loadBox = document.getElementById('loadBox');
        let num = 0;

        function loadProgress() {
            if (num <= 100) {
                bar.style.width = num + '%';
                percent.innerText = num + '%';
                num++;
                setTimeout(loadProgress, 25);
            } else {
                // 触发缩小变圆渐隐动画
                setTimeout(() => {
                    loadBox.classList.add('end-close');
                    percent.classList.add('end-close');
                    // 动画结束跳转到主页面 index.html
                    setTimeout(() => {
                        location.href = "主页面.html";
                    }, 600);
                }, 300);
            }
        }
        loadProgress();
    </script>
</body>
</html>
